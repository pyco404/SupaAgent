[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.93"

[workspace.dependencies]
supa-domain = { path = "crates/domain" }
supa-persistence = { path = "crates/persistence" }
supa-providers = { path = "crates/providers" }
supa-capabilities = { path = "crates/capabilities" }
supa-runtime = { path = "crates/runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "net", "sync", "io-util"] }
async-trait = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
axum = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tower = { version = "0.5", features = ["util"] }

dotenvy = "0.15.7"

bs58 = "0.5.1"
ring = "0.17.14"
zeroize = "1.9"
tempfile = "3.27"
base64 = "0.22.1"
