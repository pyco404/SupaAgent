name: Copy validated PostgreSQL image to private package

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact separately approved main source SHA for this copy workflow
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: supa-private-postgres-publication
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  copy-private:
    if: github.repository == 'pyco404/SupaAgent' && github.ref == 'refs/heads/main' && github.actor == 'pyco404' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
    steps:
      - name: Check out approved source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run network-free copy guard tests
        run: python3 scripts/test-private-postgres-copy.py
      - name: Install supported registry transfer tool
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo
          skopeo --version
      - name: Copy once and verify explicit privacy and every content digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/copy-private-postgres.py --authorize-provisional-private-copy
